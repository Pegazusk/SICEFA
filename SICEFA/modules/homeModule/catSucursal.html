              integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
              crossorigin="anonymous" referrerpolicy="no-referrer" />

    <body class="body_catsucursal">
        <div class="container d-flex justify-content-between">

            <div class="text-center" style="width: 70px; cursor: pointer;">
                <img src="img/perifil.jpeg" class="rounded-pill" style="width: 50px;">

        <nav class="navbar navbar-expand-lg bg-body-tertiary pb-0" style="background-color: #0A0070 !important;">

        <div class="mb-lg-5">
        </div>

        <div class="container d-flex justify-content-center align-items-center hv-100 ">
            <div class="col-md-10 shadow">
                <div class="card">
                    <div class="card-body">

                        <div class="d-flex justify-content-between">
                            <h3>
                                Sucursales
                            </h3>

                            <div class="d-flex col-5">
                                <div class="col-5">
                                    <button type="button" class="btn btn-success" data-bs-toggle="modal"
                                            data-bs-target="#modalAltaSucursal">Agregar Sucursal</button>
                                </div>
                                <div class="col">
                                    <div class="input-group">
                                        <input type="search" class="form-control border-end-0 rounded-start-pill"
                                               aria-describedby="inputBusqueda" />
                                        <span class="input-group-text bg-white rounded-end-pill" id="inputBusqueda"><i
                                                class="fa fa-search text-secondary"></i></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <table class="table table-hover text-center">
                            <thead class="table-light">
                                <tr>
                                    <th>Sucursal</th>
                                    <th>Titular</th>
                                    <th>RFC Titular</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Diegito</td>
                                    <td>culito</td>
                                    <td>Grande</td>
                                    <td>
                                        <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                                                data-bs-target="#modalEditarSucursal">
                                            <i class="fa fa-edit"></i>
                                            Editar
                                        </button>
                                        <button type="button" class="btn btn-danger" data-bs-toggle="modal"
                                                data-bs-target="#modalEliminitSucursal">
                                            <i class="fa fa-trash"></i>
                                            Eliminar
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>


                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Agregar Sucursal -->
        <div class="modal fade" id="modalAltaSucursal" tabindex="-1" aria-labelledby="modalAltaSucursalLabel"
             aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="modalAltaSucursalLabel">Agregar Nuevo Sucursal</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row mb-3">
                            <div class="col">
                                <label for="">Nombre:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese el nombre de la Sucursal">
                            </div>
                            <div class="col">
                                <label for="">C.P.:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese la Concentración del Sucursal">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label for="">Domicilio:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese el nombre Generico del Sucursal">
                            </div>
                            <div class="col">
                                <label for="">Telefono:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese la unidad">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label for="">Colonia:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese su Apellido Materno">
                            </div>
                            <div class="col">
                                <label for="">Longitud:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese el precio por unidad">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label for="">Ciudad:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese la Unidad de medida">
                            </div>
                            <div class="col">
                                <label for="">Latitud:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese el Codigo">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label for="">Estado:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="ingrese la Precentación del Sucursal">
                            </div>
                            <div class="col">
                                <label for="">Estatus del Sucursal:</label>
                                <select class="form-select rounded-pill bg-secondary-subtle"
                                        aria-placeholder="Seleccione el estatusdel Sucursal">
                                    <option value="">Seleccione el estatus del Sucursal</option>
                                    <option value="">Seleccione la Precentacion del Sucursal</option>
                                    <option value="">Caducado</option>
                                    <option value="">inexistente</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-center mb-3">
                        <button type="button" class="btn btn-primary btn-lg">Agregar Nuevo Sucursal</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Modal Editar Sucursal -->
        <div class="modal fade" id="modalEditarSucursal" tabindex="-1" aria-labelledby="modalEditarSucursalLabel"
             aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="modalEliminitSucursalLabel">Editar Sucursal</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row mb-3">
                            <div class="col">
                                <label for="">Nombre:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese el nombre del Sucursal">
                            </div>
                            <div class="col">
                                <label for="">Concentración:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese la Concentración del Sucursal">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label for="">Nombre Genérico:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese el nombre Generico del Sucursal">
                            </div>
                            <div class="col">
                                <label for="">Unidades de envase:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese la unidad">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label for="">Formula Farmaceutica:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese su Apellido Materno">
                            </div>
                            <div class="col">
                                <label for="">Precio Unitario:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese el precio por unidad">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label for="">Unidad de medida:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese la Unidad de medida">
                            </div>
                            <div class="col">
                                <label for="">Codigo de Brras:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="Ingrese el Codigo">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label for="">Precentación:</label>
                                <input type="text" class="form-control rounded-pill bg-secondary-subtle"
                                       placeholder="ingrese la Precentación del Sucursal">
                            </div>
                            <div class="col">
                                <label for="">Estatus del Sucursal:</label>
                                <select class="form-select rounded-pill bg-secondary-subtle"
                                        aria-placeholder="Seleccione el estatusdel Sucursal">
                                    <option value="">Seleccione el estatus del Sucursal</option>
                                    <option value="">Seleccione la Precentacion del Sucursal</option>
                                    <option value="">Caducado</option>
                                    <option value="">inexistente</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-center mb-3">
                        <button type="button" class="btn btn-primary btn-lg">Editar Sucursal</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Modal Eliminar Sucursal -->
        <div class="modal fade" id="modalEliminitSucursal" tabindex="-1" aria-labelledby="modalEliminitSucursalLabel"
             aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="modalEliminitSucursalLabel"></h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="d-flex justify-content-center m-2">
                            <img src="img/aviso.png" alt="" style="height: 400px;">
                        </div>
                    </div>
                    <div class="d-flex justify-content-around mb-4">
                        <button type="button" style="width: 200px; border-radius: 50px;" class="btn btn-danger btn-lg "
                                data-bs-toggle="modal" data-bs-target="#modalConfirmadoSucursal">Eliminar</button>
                        <button type="button" style="width: 200px; border-radius: 50px;" class="btn btn-primary btn-lg "
                                data-bs-toggle="modal" data-bs-target="#modalCanceladoSucursal">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Modal Eliminar Confirmado Sucursal -->
        <div class="modal fade" id="modalConfirmadoSucursal" tabindex="-1" aria-labelledby="modalConfirmadoSucursalLabel"
             aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="modalConfirmadoSucursalLabel"></h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="d-flex justify-content-center m-2">
                            <img src="img/palomita.png" alt="" style="height: 400px;">
                        </div>
                    </div>
                    <div class="d-flex justify-content-around mb-4">
                        <button type="button" style="width: 200px; border-radius: 50px;" class="btn btn-primary btn-lg "
                                data-bs-toggle="modal" data-bs-target="#modalConfirmadoSucursal">Ok</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Modal Eliminar Cancelado Sucursal -->
        <div class="modal fade" id="modalCanceladoSucursal" tabindex="-1" aria-labelledby="modalCanceladoSucursalLabel"
             aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="modalCanceladoSucursalLabel"></h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="d-flex justify-content-center m-2">
                            <img src="img/equis.png" alt="" style="height: 400px;">
                        </div>
                    </div>
                    <div class="d-flex justify-content-around mb-4">
                        <button type="button" style="width: 200px; border-radius: 50px;" class="btn btn-primary btn-lg "
                                data-bs-toggle="modal" data-bs-target="#modalCanceladoSucursal">Ok</button>
                    </div>
                </div>
            </div>
        </div>

    </body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
