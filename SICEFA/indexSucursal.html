<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> LOGIN SICEFA SUCURSAL </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="modules/homeModule/img/logo_trans.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="./sweetalert/sweetalert2.min.css">
</head>

<body class="fondo_login">

    <div class="container">
        <div class="d-flex justify-content-center" style="margin-top: 50px; margin-bottom: 60px;">
            <div class="col-4">
                <img src="modules/homeModule/img/sicefa_logo_trans.png" class="img-fluid">
            </div>
        </div>
        <div class="d-flex justify-content-center">
            <div class="col-md-4 text-center">
                <div class="card-body">
                    <div class="mb-4">
                        <input type="email" class="form-control rounded-pill form-control-lg " placeholder="Sucursal"
                            id="usuarioSucur">
                    </div>
                    <div class="mb-4">
                        <input type="password" required class="form-control rounded-pill form-control-lg"
                            placeholder="Contraseña" id="claveSucur">
                    </div>
                    <div class="d-flex justify-content-center">
                        <a class="button_login" style="vertical-align:middle;">
                            <span onclick="logear()">Entrar</span>
                        </a>
                    </div>
                    <div class="d-flex justify-content-center">
                        <a href="index.html" class="button_login" style="vertical-align:middle;">
                            <span>CENTRAL</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
<script src="./sweetalert/sweetalert2.all.min.js"></script>
<script src="indexSucursal.js"></script>

</html>
